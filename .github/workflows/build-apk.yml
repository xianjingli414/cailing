name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Build APK
      run: |
        # 双重保障：接受 Android SDK 许可证
        SDK_LICENSE_HASH=24333f8a63b6825ea9c5514f83c2829b004d1fee
        mkdir -p "$HOME/.android/licenses"
        echo -e "\n$SDK_LICENSE_HASH" > "$HOME/.android/licenses/android-sdk-license"
        buildozer -v android debug 2>&1 | tee build.log
        echo "=== bin/ 目录内容 ==="
        ls -la bin/ || echo "bin/ 目录不存在！"
        echo "=== 当前目录 ==="
        ls -la

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
