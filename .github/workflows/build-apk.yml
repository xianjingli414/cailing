name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Build APK
      run: |
        # Clear cached SDK (may be corrupted from previous runs)
        rm -rf "$HOME/.buildozer/android/platform/android-sdk"*
        rm -rf "$HOME/.buildozer/android/platform/android-ndk"*
        # Pre-create license files in all possible SDK locations
        HASH=24333f8a63b6825ea9c5514f83c2829b004d1fee
        for D in "$HOME/.android" "$HOME/.buildozer/android/platform/android-sdk"; do
          mkdir -p "$D/licenses"
          printf "\n%s\n" "$HASH" > "$D/licenses/android-sdk-license"
        done
        # Use yes pipe to auto-accept any remaining prompts
        yes | buildozer -v android debug 2>&1 | tee build.log
        RC=${PIPESTATUS[1]}
        echo "=== Buildozer exit: $RC ==="
        ls -laR bin/ || echo "bin/ not found"
        exit $RC

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
