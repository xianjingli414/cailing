name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (first pass - initializes p4a)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log
        echo "Build exit code: $?"

    - name: Patch p4a source and rebuild
      run: |
        P4A_DIR=$(find ~/.buildozer/android/platform -name "python-for-android" -type d 2>/dev/null | head -1)
        if [ -z "$P4A_DIR" ]; then
          echo "ERROR: p4a directory not found"
          exit 1
        fi
        echo "P4A dir: $P4A_DIR"

        # ── 1. Patch AndroidManifest.tmpl.xml - 注入权限 ──
        MANIFEST_TEMPLATE="$P4A_DIR/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$MANIFEST_TEMPLATE" ]; then
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_TEMPLATE"; then
            sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_TEMPLATE"
            echo "Permissions injected into AndroidManifest"
          fi
        fi

        # ── 2. Patch PythonActivity.java (p4a源码中的模板) ──
        PYTHON_ACTIVITY_SRC="$P4A_DIR/pythonforandroid/bootstraps/webview/build/src/main/java/org/kivy/android/PythonActivity.java"
        if [ -f "$PYTHON_ACTIVITY_SRC" ]; then
          echo "Patching PythonActivity.java source template..."

          # 2a. 复制WifiBridge.java到同目录
          cp source/java/org/kivy/android/WifiBridge.java "$(dirname $PYTHON_ACTIVITY_SRC)/"
          echo "WifiBridge.java copied to p4a source"

          # 2b. 修改PythonActivity.java
          # 添加 import 语句
          sed -i '/^import org.renpy.android.ResourceManager;$/a\import org.kivy.android.WifiBridge;' "$PYTHON_ACTIVITY_SRC"

          # 添加 WifiBridge 成员变量
          sed -i '/public static PythonActivity mActivity = null;/a\    public static WifiBridge mWifiBridge = null;' "$PYTHON_ACTIVITY_SRC"

          # 在 setDomStorageEnabled 后添加 WifiBridge 初始化
          sed -i '/mWebView.getSettings().setDomStorageEnabled(true);/a\            mWebView.getSettings().setAllowFileAccessFromFileURLs(true);\n            mWebView.getSettings().setAllowUniversalAccessFromFileURLs(true);\n            mWifiBridge = new WifiBridge(PythonActivity.mActivity);\n            mWebView.addJavascriptInterface(mWifiBridge, "WifiBridge");' "$PYTHON_ACTIVITY_SRC"

          echo "PythonActivity.java patched"
          grep -c "WifiBridge" "$PYTHON_ACTIVITY_SRC"
        else
          echo "WARNING: PythonActivity.java not found"
        fi

        # ── 3. 同时 patch 已生成的构建目录中的 PythonActivity.java ──
        # p4a构建时会从模板复制到构建目录，需要在构建前确保模板已被修改
        # 查找已生成的构建目录中的 PythonActivity.java
        BUILD_DIR=$(find .buildozer/android/platform/build-*/dists/cailing -name "PythonActivity.java" 2>/dev/null | head -1)
        if [ -n "$BUILD_DIR" ]; then
          echo "Also patching built PythonActivity.java: $BUILD_DIR"
          # 用已修改的模板覆盖构建目录中的文件
          cp "$PYTHON_ACTIVITY_SRC" "$BUILD_DIR"
          cp "$(dirname $PYTHON_ACTIVITY_SRC)/WifiBridge.java" "$(dirname $BUILD_DIR)/"
        fi

        # ── 4. 清除缓存重新构建 ──
        rm -f bin/*.apk
        rm -rf .buildozer/android/platform/build-*/dists/cailing/build
        rm -rf .buildozer/android/platform/build-*/build/cailing

        yes | buildozer -v android debug 2>&1 | tee -a build.log
        RC=$?
        echo "Final build exit code: $RC"
        ls -laR bin/ || echo "bin/ not found"
        exit $RC

    - name: Verify APK
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "permission\|ACCESS_\|WIFI\|LOCATION\|INTERNET" || echo "Could not extract manifest strings"
          echo "=== Checking classes.dex for WifiBridge ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "WifiBridge" && echo "WifiBridge FOUND in APK!" || echo "WifiBridge NOT found in classes.dex"
        else
          echo "No APK found to verify"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
