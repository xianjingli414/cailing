name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (first pass)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log

    - name: Patch and rebuild
      run: |
        # ── 1. Patch AndroidManifest permissions ──
        P4A_DIR=$(find ~/.buildozer/android/platform -name "python-for-android" -type d 2>/dev/null | head -1)
        MANIFEST_TEMPLATE="$P4A_DIR/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$MANIFEST_TEMPLATE" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_TEMPLATE"; then
          sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_TEMPLATE"
          echo "Permissions injected"
        fi

        # ── 2. 找到构建产物目录中的PythonActivity.java ──
        # 关键：直接修改已生成的dist目录中的文件，而不是p4a源码模板
        DIST_DIR=$(find .buildozer/android/platform/build-*/dists/cailing -type d 2>/dev/null | head -1)
        if [ -z "$DIST_DIR" ]; then
          echo "ERROR: dist directory not found"
          exit 1
        fi
        echo "Dist dir: $DIST_DIR"

        PYTHON_ACTIVITY="$DIST_DIR/src/main/java/org/kivy/android/PythonActivity.java"
        if [ ! -f "$PYTHON_ACTIVITY" ]; then
          echo "ERROR: PythonActivity.java not found"
          find "$DIST_DIR" -name "PythonActivity.java" 2>/dev/null
          exit 1
        fi
        echo "Found PythonActivity.java: $PYTHON_ACTIVITY"

        # 2a. 复制WifiBridge.java到同目录
        WIFI_DIR="$(dirname $PYTHON_ACTIVITY)"
        cp source/java/org/kivy/android/WifiBridge.java "$WIFI_DIR/"
        echo "WifiBridge.java copied to $WIFI_DIR"
        ls -la "$WIFI_DIR/WifiBridge.java"

        # 2b. 修改PythonActivity.java
        # 添加 import
        sed -i '/^import org.renpy.android.ResourceManager;$/a\import org.kivy.android.WifiBridge;' "$PYTHON_ACTIVITY"

        # 添加成员变量
        sed -i '/public static PythonActivity mActivity = null;/a\    public static WifiBridge mWifiBridge = null;' "$PYTHON_ACTIVITY"

        # 在setDomStorageEnabled后注入WifiBridge初始化
        sed -i '/mWebView.getSettings().setDomStorageEnabled(true);/a\            mWebView.getSettings().setAllowFileAccessFromFileURLs(true);\n            mWebView.getSettings().setAllowUniversalAccessFromFileURLs(true);\n            mWifiBridge = new WifiBridge(PythonActivity.mActivity);\n            mWebView.addJavascriptInterface(mWifiBridge, "WifiBridge");' "$PYTHON_ACTIVITY"

        echo "PythonActivity.java patched. Verifying..."
        grep -c "WifiBridge" "$PYTHON_ACTIVITY" || echo "WARNING: WifiBridge not found in patched file"
        grep "addJavascriptInterface" "$PYTHON_ACTIVITY" || echo "WARNING: addJavascriptInterface not found"

        # ── 3. 只重新运行Gradle构建（不重新运行整个buildozer流程） ──
        cd "$DIST_DIR"
        echo "Running Gradle build..."
        ./gradlew assembleDebug 2>&1 || { echo "Gradle build failed"; exit 1; }
        cd -

        # 复制APK到bin目录
        mkdir -p bin
        cp "$DIST_DIR/build/outputs/apk/debug/cailing-debug.apk" bin/ || true
        # 重命名
        APK=$(find bin/ -name "cailing-debug.apk" 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          mv "$APK" "bin/cailing-1.0.0-arm64-v8a_armeabi-v7a-debug.apk"
        fi
        ls -la bin/

    - name: Verify APK
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== Checking classes.dex for WifiBridge ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "WifiBridge" && echo "✅ WifiBridge FOUND!" || echo "❌ WifiBridge NOT found"
          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "ACCESS_\|WIFI\|LOCATION\|INTERNET"
        else
          echo "No APK found"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
