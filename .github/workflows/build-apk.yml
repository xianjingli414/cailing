name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (first pass - initializes p4a)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log
        echo "Build exit code: $?"

    - name: Patch AndroidManifest with permissions and rebuild
      run: |
        # 找到 p4a webview bootstrap 的 AndroidManifest 模板
        P4A_DIR=$(find ~/.buildozer/android/platform -name "python-for-android" -type d 2>/dev/null | head -1)
        if [ -n "$P4A_DIR" ]; then
          MANIFEST_TEMPLATE="$P4A_DIR/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
          if [ -f "$MANIFEST_TEMPLATE" ]; then
            echo "Patching $MANIFEST_TEMPLATE"
            # 检查是否已经包含 ACCESS_FINE_LOCATION
            if grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_TEMPLATE"; then
              echo "Permissions already present, skipping patch"
            else
              # 在 INTERNET 权限行后注入额外权限
              sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_TEMPLATE"
              echo "Permissions injected. Verifying:"
              grep "uses-permission" "$MANIFEST_TEMPLATE"
            fi
          else
            echo "WARNING: Manifest template not found at $MANIFEST_TEMPLATE"
            find "$P4A_DIR" -name "AndroidManifest*" 2>/dev/null || true
          fi
        else
          echo "WARNING: p4a directory not found"
        fi

        # 清除已生成的 APK 和 gradle 缓存，强制重新生成 AndroidManifest
        rm -f bin/*.apk
        rm -rf .buildozer/android/platform/build-*/dists/cailing/build
        rm -rf .buildozer/android/platform/build-*/build/cailing

        # 重新构建（这次使用 patch 过的模板）
        yes | buildozer -v android debug 2>&1 | tee -a build.log
        RC=$?
        echo "Final build exit code: $RC"
        ls -laR bin/ || echo "bin/ not found"
        exit $RC

    - name: Verify permissions in APK
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "Checking permissions in $APK"
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "permission\|ACCESS_\|WIFI\|LOCATION\|INTERNET" || echo "Could not extract manifest strings"
        else
          echo "No APK found to verify"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
