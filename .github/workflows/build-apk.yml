name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (first pass - initializes p4a)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log
        echo "Build exit code: $?"

    - name: Patch p4a source and rebuild
      run: |
        P4A_DIR=$(find ~/.buildozer/android/platform -name "python-for-android" -type d 2>/dev/null | head -1)
        if [ -z "$P4A_DIR" ]; then
          echo "ERROR: p4a directory not found"
          exit 1
        fi
        echo "P4A dir: $P4A_DIR"

        # ── 1. Patch AndroidManifest.tmpl.xml - 注入权限 ──
        MANIFEST_TEMPLATE="$P4A_DIR/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$MANIFEST_TEMPLATE" ]; then
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_TEMPLATE"; then
            sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_TEMPLATE"
            echo "Permissions injected into AndroidManifest"
          fi
        fi

        # ── 2. Patch PythonActivity.java - 添加WifiBridge ──
        PYTHON_ACTIVITY="$P4A_DIR/pythonforandroid/bootstraps/webview/build/src/main/java/org/kivy/android/PythonActivity.java"
        if [ -f "$PYTHON_ACTIVITY" ]; then
          echo "Patching PythonActivity.java..."

          # 2a. 复制WifiBridge.java到同目录
          cp source/java/org/kivy/android/WifiBridge.java "$(dirname $PYTHON_ACTIVITY)/"
          echo "WifiBridge.java copied"

          # 2b. 在PythonActivity.java中添加WifiBridge的import和初始化代码
          # 添加 import 语句
          sed -i '/^import org.renpy.android.ResourceManager;$/a\import org.kivy.android.WifiBridge;' "$PYTHON_ACTIVITY"

          # 添加 WifiBridge 成员变量
          sed -i '/public static PythonActivity mActivity = null;/a\    public static WifiBridge mWifiBridge = null;' "$PYTHON_ACTIVITY"

          # 在 mWebView.getSettings().setDomStorageEnabled(true); 之后添加 addJavascriptInterface
          # 同时也添加 setAllowFileAccessFromFileURLs 以便本地文件也能访问
          sed -i '/mWebView.getSettings().setDomStorageEnabled(true);/a\            mWebView.getSettings().setAllowFileAccessFromFileURLs(true);\n            mWebView.getSettings().setAllowUniversalAccessFromFileURLs(true);\n            // 注册 WifiBridge 到 WebView\n            mWifiBridge = new WifiBridge(PythonActivity.mActivity);\n            mWebView.addJavascriptInterface(mWifiBridge, "WifiBridge");' "$PYTHON_ACTIVITY"

          echo "PythonActivity.java patched with WifiBridge"
          # 验证
          grep -c "WifiBridge" "$PYTHON_ACTIVITY"
        else
          echo "WARNING: PythonActivity.java not found at $PYTHON_ACTIVITY"
        fi

        # ── 3. 清除缓存重新构建 ──
        rm -f bin/*.apk
        rm -rf .buildozer/android/platform/build-*/dists/cailing/build
        rm -rf .buildozer/android/platform/build-*/build/cailing

        yes | buildozer -v android debug 2>&1 | tee -a build.log
        RC=$?
        echo "Final build exit code: $RC"
        ls -laR bin/ || echo "bin/ not found"
        exit $RC

    - name: Verify APK
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "permission\|ACCESS_\|WIFI\|LOCATION\|INTERNET" || echo "Could not extract manifest strings"
          echo "=== Checking for WifiBridge ==="
          unzip -l "$APK" 2>/dev/null | grep -i "wifibridge\|PythonActivity" || echo "No WifiBridge class found in APK"
          echo "=== Checking classes.dex ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "WifiBridge" || echo "WifiBridge not found in classes.dex"
        else
          echo "No APK found to verify"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
