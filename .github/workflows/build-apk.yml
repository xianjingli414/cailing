name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (first pass)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log

    - name: Patch and force full rebuild
      run: |
        set -ex

        # ══════════════════════════════════════════════════
        # Find p4a and dist directories
        # ══════════════════════════════════════════════════
        P4A_DIR=$(find . ~/.buildozer /home/runner -name "python-for-android" -type d 2>/dev/null | head -1)
        DIST_DIR=$(find . ~/.buildozer /home/runner -path "*/dists/cailing" -type d 2>/dev/null | head -1)
        echo "P4A_DIR=$P4A_DIR"
        echo "DIST_DIR=$DIST_DIR"

        if [ -z "$P4A_DIR" ]; then
          echo "ERROR: p4a directory not found!"
          exit 1
        fi

        # ══════════════════════════════════════════════════
        # Patch p4a template (source of truth for new dists)
        # ══════════════════════════════════════════════════
        PA_SRC="$P4A_DIR/pythonforandroid/bootstraps/webview/build/src/main/java/org/kivy/android/PythonActivity.java"
        cp -f source/java/org/kivy/android/PythonActivity.java "$PA_SRC"
        cp -f source/java/org/kivy/android/WifiBridge.java "$(dirname $PA_SRC)/"
        echo "Patched p4a template - WifiBridge count: $(grep -c 'WifiBridge' "$PA_SRC")"

        # Patch AndroidManifest permissions in p4a template
        MANIFEST_TEMPLATE="$P4A_DIR/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$MANIFEST_TEMPLATE" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_TEMPLATE"; then
          sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_TEMPLATE"
          echo "Permissions injected into p4a template"
        fi

        # ══════════════════════════════════════════════════
        # Patch dist directory (if exists)
        # ══════════════════════════════════════════════════
        if [ -n "$DIST_DIR" ]; then
          DIST_PA="$DIST_DIR/src/main/java/org/kivy/android/PythonActivity.java"
          if [ -f "$DIST_PA" ]; then
            cp -f source/java/org/kivy/android/PythonActivity.java "$DIST_PA"
          fi
          cp -f source/java/org/kivy/android/WifiBridge.java "$DIST_DIR/src/main/java/org/kivy/android/"
          echo "Patched dist directory - WifiBridge count: $(grep -c 'WifiBridge' "$DIST_PA")"

          # Patch AndroidManifest in dist
          if [ -f "$DIST_DIR/templates/AndroidManifest.tmpl.xml" ] && ! grep -q "ACCESS_FINE_LOCATION" "$DIST_DIR/templates/AndroidManifest.tmpl.xml"; then
            sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$DIST_DIR/templates/AndroidManifest.tmpl.xml"
            echo "Permissions injected into dist template"
          fi

          # ══════════════════════════════════════════════════
          # 关键：删除整个dist目录，强制buildozer从patched模板重建
          # 只删除dist，不删除build缓存中的native libs
          # ══════════════════════════════════════════════════
          echo "Deleting dist directory to force rebuild from patched template..."
          rm -rf "$DIST_DIR"
        fi

        # ══════════════════════════════════════════════════
        # Also delete the APK so buildozer regenerates it
        # ══════════════════════════════════════════════════
        rm -f bin/*.apk

        # Rebuild - since dist is deleted, buildozer must recreate from patched template
        yes | buildozer -v android debug 2>&1 | tee -a build.log

    - name: Verify APK contents
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== APK found: $APK ==="
          ls -la "$APK"
          echo "=== Checking classes.dex for WifiBridge ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "WifiBridge" && echo "✅ WifiBridge FOUND!" || echo "❌ WifiBridge NOT found"
          echo "=== Checking classes.dex for scanWifi ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "scanWifi" && echo "✅ scanWifi FOUND!" || echo "❌ scanWifi NOT found"
          echo "=== Checking classes.dex for addJavascriptInterface ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "addJavascriptInterface" && echo "✅ addJavascriptInterface FOUND!" || echo "❌ addJavascriptInterface NOT found"
          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "ACCESS_\|WIFI\|LOCATION\|INTERNET"
        else
          echo "No APK found"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
