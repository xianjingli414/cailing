name: Build 采灵 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev python3-pip python3-venv cython3 \
          lld

    - name: Install Buildozer
      run: |
        pip3 install --upgrade pip setuptools wheel
        pip3 install cython buildozer

    - name: Build APK
      run: |
        # 双重保障：接受 Android SDK 许可证
        # 方案1: buildozer.spec 中 android.accept_sdk_license = True（[app] 节）
        # 方案2: 显式创建许可证文件作为后备
        SDK_LICENSE_HASH=24333f8a63b6825ea9c5514f83c2829b004d1fee
        mkdir -p "$HOME/.android/licenses"
        echo -e "\n$SDK_LICENSE_HASH" > "$HOME/.android/licenses/android-sdk-license"
        buildozer -v android debug 2>&1 | tee build.log
        # 调试：显示 bin/ 目录内容
        echo "=== bin/ 目录内容 ==="
        ls -la bin/ || echo "bin/ 目录不存在！"
        echo "=== 当前目录 ==="
        ls -la

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
