name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Prepare patched p4a source
      run: |
        set -ex
        # Clone p4a to a known local directory
        git clone --depth=1 -b master https://github.com/kivy/python-for-android.git /tmp/p4a-local

        # Overwrite PythonActivity.java with our patched version
        PA_FILE="/tmp/p4a-local/pythonforandroid/bootstraps/webview/build/src/main/java/org/kivy/android/PythonActivity.java"
        cp -f source/java/org/kivy/android/PythonActivity.java "$PA_FILE"
        echo "PythonActivity.java patched, WifiBridge count: $(grep -c 'WifiBridge' "$PA_FILE")"

        # Copy WifiBridge.java to the same directory
        cp -f source/java/org/kivy/android/WifiBridge.java "$(dirname $PA_FILE)/"
        echo "WifiBridge.java copied, file exists: $(ls -la "$(dirname $PA_FILE)/WifiBridge.java" | awk '{print $5}') bytes"

        # Patch AndroidManifest permissions
        MANIFEST="/tmp/p4a-local/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$MANIFEST" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
          sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          echo "AndroidManifest permissions injected"
        fi

        echo "=== Verification ==="
        echo "WifiBridge in PythonActivity: $(grep -c 'WifiBridge' "$PA_FILE")"
        echo "WifiBridge.java exists: $(test -f "$(dirname $PA_FILE)/WifiBridge.java" && echo YES || echo NO)"
        echo "Permissions in manifest: $(grep -c 'ACCESS_FINE_LOCATION' "$MANIFEST")"

    - name: Update buildozer.spec to use local p4a
      run: |
        # Add p4a.source_dir to buildozer.spec
        if ! grep -q "p4a.source_dir" buildozer.spec; then
          echo "" >> buildozer.spec
          echo "# Use pre-patched local p4a source" >> buildozer.spec
          echo "p4a.source_dir = /tmp/p4a-local" >> buildozer.spec
        else
          sed -i 's|p4a.source_dir.*|p4a.source_dir = /tmp/p4a-local|' buildozer.spec
        fi
        echo "buildozer.spec updated:"
        grep "p4a.source_dir" buildozer.spec

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (single pass with patched p4a)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log

    - name: Verify APK contents
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== APK found: $APK ==="
          echo "=== File size ==="
          ls -la "$APK"
          echo "=== Checking classes.dex for WifiBridge ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "WifiBridge" && echo "✅ WifiBridge FOUND!" || echo "❌ WifiBridge NOT found"
          echo "=== Checking classes.dex for scanWifi ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "scanWifi" && echo "✅ scanWifi FOUND!" || echo "❌ scanWifi NOT found"
          echo "=== Checking classes.dex for addJavascriptInterface ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "addJavascriptInterface" && echo "✅ addJavascriptInterface FOUND!" || echo "❌ addJavascriptInterface NOT found"
          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "ACCESS_\|WIFI\|LOCATION\|INTERNET"
        else
          echo "No APK found"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
