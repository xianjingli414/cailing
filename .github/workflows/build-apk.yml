name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (first pass - initializes p4a)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log

    - name: Patch and rebuild
      run: |
        set -x  # 开启调试输出

        P4A_DIR=$(find ~/.buildozer/android/platform -name "python-for-android" -type d 2>/dev/null | head -1)
        echo "P4A_DIR=$P4A_DIR"

        # ── 1. Patch AndroidManifest permissions in p4a template ──
        MANIFEST_TEMPLATE="$P4A_DIR/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$MANIFEST_TEMPLATE" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_TEMPLATE"; then
          sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_TEMPLATE"
          echo "Permissions injected into template"
        fi

        # ── 2. Patch PythonActivity.java in p4a template ──
        PA_SRC="$P4A_DIR/pythonforandroid/bootstraps/webview/build/src/main/java/org/kivy/android/PythonActivity.java"
        if [ -f "$PA_SRC" ]; then
          echo "Found PythonActivity.java template"

          # 复制WifiBridge.java到同目录
          cp source/java/org/kivy/android/WifiBridge.java "$(dirname $PA_SRC)/"
          ls -la "$(dirname $PA_SRC)/WifiBridge.java"

          # 添加import
          sed -i 's/^import org.renpy.android.ResourceManager;/import org.kivy.android.WifiBridge;\nimport org.renpy.android.ResourceManager;/' "$PA_SRC"

          # 添加成员变量
          sed -i 's/public static PythonActivity mActivity = null;/public static PythonActivity mActivity = null;\n    public static WifiBridge mWifiBridge = null;/' "$PA_SRC"

          # 在setDomStorageEnabled后注入WifiBridge初始化 + 允许本地文件访问
          sed -i 's/mWebView.getSettings().setDomStorageEnabled(true);/mWebView.getSettings().setDomStorageEnabled(true);\n            mWebView.getSettings().setAllowFileAccessFromFileURLs(true);\n            mWebView.getSettings().setAllowUniversalAccessFromFileURLs(true);\n            mWifiBridge = new WifiBridge(PythonActivity.mActivity);\n            mWebView.addJavascriptInterface(mWifiBridge, "WifiBridge");/' "$PA_SRC"

          echo "PythonActivity.java template patched"
          grep -c "WifiBridge" "$PA_SRC"
        else
          echo "WARNING: PythonActivity.java template not found"
        fi

        # ── 3. 清除已构建的dist，强制从patched模板重建 ──
        rm -f bin/*.apk
        rm -rf .buildozer/android/platform/build-*/dists/cailing

        # 重新构建（这次会用patched模板生成新的dist）
        yes | buildozer -v android debug 2>&1 | tee -a build.log

    - name: Verify APK
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== Checking classes.dex for WifiBridge ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "WifiBridge" && echo "✅ WifiBridge FOUND!" || echo "❌ WifiBridge NOT found"
          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "ACCESS_\|WIFI\|LOCATION\|INTERNET"
        else
          echo "No APK found"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
