name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    # ══════════════════════════════════════════════════════════
    # 第一步：只运行一次 buildozer，生成初始 APK + dist
    # 不再运行第二次 buildozer（它会覆盖我们的 patch）
    # ══════════════════════════════════════════════════════════
    - name: Build APK (single buildozer pass)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log

    # ══════════════════════════════════════════════════════════
    # 第二步：Post-build — 直接操作 dist，用 Gradle 重新编译
    # 关键：不再运行 buildozer，只运行 Gradle
    # ══════════════════════════════════════════════════════════
    - name: "Patch dist and rebuild with Gradle"
      run: |
        set -ex

        # 找到 dist 目录
        DIST_DIR=$(find . ~/.buildozer /home/runner -path "*/dists/cailing" -type d 2>/dev/null | head -1)
        echo "DIST_DIR=$DIST_DIR"

        if [ -z "$DIST_DIR" ]; then
          echo "ERROR: dist directory not found!"
          exit 1
        fi

        # ── 1. 列出 dist 中原始 Java 文件（debug用）──
        echo "=== Original Java files in dist ==="
        find "$DIST_DIR/src/main/java/org/kivy/android/" -name "*.java" -exec ls -la {} \;

        # ── 2. 覆盖 PythonActivity.java ──
        PA_DEST="$DIST_DIR/src/main/java/org/kivy/android/PythonActivity.java"
        cp -f source/java/org/kivy/android/PythonActivity.java "$PA_DEST"
        echo "PythonActivity.java patched - WifiBridge refs: $(grep -c 'WifiBridge' "$PA_DEST")"

        # ── 3. 复制 WifiBridge.java 到 dist ──
        WB_DEST="$DIST_DIR/src/main/java/org/kivy/android/WifiBridge.java"
        cp -f source/java/org/kivy/android/WifiBridge.java "$WB_DEST"
        echo "WifiBridge.java copied - size: $(wc -c < "$WB_DEST") bytes"

        # ── 4. 验证 patch 后的文件 ──
        echo "=== Patched Java files in dist ==="
        find "$DIST_DIR/src/main/java/org/kivy/android/" -name "*.java" -exec ls -la {} \;
        echo "=== PythonActivity WifiBridge references ==="
        grep -n "WifiBridge" "$PA_DEST"
        echo "=== WifiBridge class declaration ==="
        grep -n "class WifiBridge\|@JavascriptInterface\|public String scanWifi" "$WB_DEST"

        # ── 5. 替换App图标 ──
        echo "Replacing app icons in dist res directory..."
        RES_DIR="$DIST_DIR/src/main/res"
        if [ -d "$RES_DIR" ]; then
          # 列出原始图标资源
          echo "=== Original icon resources ==="
          find "$RES_DIR" \( -name "ic_launcher*" -o -name "icon*" -o -name "ic_launcher_round*" \) | head -30

          # 查找AndroidManifest.xml中引用的图标名
          MANIFEST="$DIST_DIR/src/main/AndroidManifest.xml"
          ICON_REF=""
          if [ -f "$MANIFEST" ]; then
            ICON_REF=$(grep -oP 'android:icon="@\w+/(\w+)"' "$MANIFEST" | head -1 | grep -oP '"@\w+/\K\w+')
            echo "AndroidManifest icon reference: $ICON_REF"
          fi

          # 复制自定义图标到各mipmap目录
          # 无论模板用什么文件名，都替换ic_launcher.png并创建ICON_REF的副本
          for mipmap in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            TARGET_DIR="$RES_DIR/$mipmap"
            mkdir -p "$TARGET_DIR"
            if [ -f "source/icons/$mipmap/ic_launcher.png" ]; then
              # 替换ic_launcher.png
              cp -f "source/icons/$mipmap/ic_launcher.png" "$TARGET_DIR/ic_launcher.png"
              echo "✅ Replaced $mipmap/ic_launcher.png"

              # 如果AndroidManifest引用了不同的图标名，也创建对应的文件
              if [ -n "$ICON_REF" ] && [ "$ICON_REF" != "ic_launcher" ]; then
                cp -f "source/icons/$mipmap/ic_launcher.png" "$TARGET_DIR/${ICON_REF}.png"
                echo "✅ Also created $mipmap/${ICON_REF}.png"
              fi

              # 也替换可能存在的其他图标变体（ic_launcher_round等）
              for existing in "$TARGET_DIR"/ic_launcher_round*; do
                if [ -f "$existing" ]; then
                  cp -f "source/icons/$mipmap/ic_launcher.png" "$existing"
                  echo "✅ Replaced $(basename $existing) in $mipmap"
                fi
              done
            fi
          done

          # 替换presplash
          DRAWABLE_DIR="$RES_DIR/drawable"
          mkdir -p "$DRAWABLE_DIR"
          if [ -f "source/icons/drawable/presplash.png" ]; then
            cp -f "source/icons/drawable/presplash.png" "$DRAWABLE_DIR/presplash.png"
            echo "✅ Replaced drawable/presplash.png"
            # 也替换可能的presplash变体
            for existing in "$DRAWABLE_DIR"/presplash*; do
              if [ -f "$existing" ] && [ "$existing" != "$DRAWABLE_DIR/presplash.png" ]; then
                cp -f "source/icons/drawable/presplash.png" "$existing"
                echo "✅ Replaced $(basename $existing) in drawable"
              fi
            done
          fi

          echo "=== Replaced icon resources ==="
          find "$RES_DIR" \( -name "ic_launcher*" -o -name "presplash*" -o -name "icon*" \) | head -30
        else
          echo "WARNING: res directory not found at $RES_DIR"
        fi

        # ── 6. 清除所有 Gradle 缓存（包括 .gradle 目录）──
        echo "Clearing ALL Gradle caches..."
        rm -rf "$DIST_DIR/build"
        rm -rf "$DIST_DIR/.gradle"

        # ── 7. 用 Gradle 直接重新编译 APK ──
        cd "$DIST_DIR"
        echo "Running ./gradlew clean assembleDebug..."
        ./gradlew clean assembleDebug --info 2>&1 | tee -a /home/runner/work/cailing/cailing/build.log

        # ── 8. 复制新 APK 到 bin 目录 ──
        cd /home/runner/work/cailing/cailing
        NEW_APK=$(find "$DIST_DIR/build/outputs/apk/" -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$NEW_APK" ]; then
          rm -f bin/*.apk
          cp -f "$NEW_APK" bin/cailing-1.0.0-arm64-v8a-debug.apk
          echo "New APK copied: $(ls -la bin/*.apk)"
        else
          echo "ERROR: No APK found after Gradle build!"
          exit 1
        fi

    - name: Verify APK contents
      if: always()
      run: |
        set +e
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== APK found: $APK ==="
          ls -la "$APK"

          # 列出 APK 中所有 dex 文件
          echo "=== DEX files in APK ==="
          unzip -l "$APK" | grep "classes.*\.dex"

          # 检查所有 dex 文件中的关键符号
          FOUND_WIFIBRIDGE=0
          FOUND_SCANWIFI=0
          for dex in $(unzip -l "$APK" | grep -oP 'classes\d*\.dex'); do
            echo "=== Checking $dex ==="
            if unzip -p "$APK" "$dex" 2>/dev/null | strings | grep -q "WifiBridge"; then
              echo "✅ WifiBridge FOUND in $dex"
              FOUND_WIFIBRIDGE=1
            else
              echo "❌ WifiBridge NOT in $dex"
            fi
            if unzip -p "$APK" "$dex" 2>/dev/null | strings | grep -q "scanWifi"; then
              echo "✅ scanWifi FOUND in $dex"
              FOUND_SCANWIFI=1
            fi
            if unzip -p "$APK" "$dex" 2>/dev/null | strings | grep -q "addJavascriptInterface"; then
              echo "✅ addJavascriptInterface FOUND in $dex"
            fi
            # 列出 org.kivy.android 包中的所有类
            echo "--- org.kivy.android classes in $dex ---"
            unzip -p "$APK" "$dex" 2>/dev/null | strings | grep "org/kivy/android/" | sort -u | head -20
          done

          echo ""
          echo "=== FINAL RESULT ==="
          if [ "$FOUND_WIFIBRIDGE" = "1" ]; then
            echo "✅✅✅ WifiBridge is in the APK! ✅✅✅"
          else
            echo "❌❌❌ WifiBridge NOT in any dex file ❌❌❌"
          fi

          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "ACCESS_\|WIFI\|LOCATION\|INTERNET" || true

          echo "=== Checking app icons in APK ==="
          unzip -l "$APK" | grep -E "ic_launcher|presplash|icon" | head -20 || true
        else
          echo "No APK found"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
