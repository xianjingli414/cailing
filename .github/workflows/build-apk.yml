name: Build 采灵 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.10

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool libltdl-dev pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer ~/.android

    - name: Build APK (first pass)
      run: |
        yes | buildozer -v android debug 2>&1 | tee build.log

    - name: Patch and force complete rebuild
      run: |
        set -ex

        P4A_DIR=$(find . ~/.buildozer /home/runner -name "python-for-android" -type d 2>/dev/null | head -1)
        DIST_DIR=$(find . ~/.buildozer /home/runner -path "*/dists/cailing" -type d 2>/dev/null | head -1)
        echo "P4A_DIR=$P4A_DIR"
        echo "DIST_DIR=$DIST_DIR"

        if [ -z "$P4A_DIR" ]; then
          echo "ERROR: p4a not found!"
          exit 1
        fi

        # ══════════════════════════════════════════════════
        # 1. Patch p4a template (source of truth for new dists)
        # ══════════════════════════════════════════════════
        PA_SRC="$P4A_DIR/pythonforandroid/bootstraps/webview/build/src/main/java/org/kivy/android/PythonActivity.java"
        cp -f source/java/org/kivy/android/PythonActivity.java "$PA_SRC"
        cp -f source/java/org/kivy/android/WifiBridge.java "$(dirname $PA_SRC)/"
        echo "Patched p4a template - WifiBridge count: $(grep -c 'WifiBridge' "$PA_SRC")"

        # Patch AndroidManifest permissions
        MANIFEST_TEMPLATE="$P4A_DIR/pythonforandroid/bootstraps/webview/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$MANIFEST_TEMPLATE" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_TEMPLATE"; then
          sed -i '/uses-permission.*INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_TEMPLATE"
          echo "Permissions injected"
        fi

        # ══════════════════════════════════════════════════
        # 2. Patch dist directory
        # ══════════════════════════════════════════════════
        if [ -n "$DIST_DIR" ]; then
          cp -f source/java/org/kivy/android/PythonActivity.java "$DIST_DIR/src/main/java/org/kivy/android/"
          cp -f source/java/org/kivy/android/WifiBridge.java "$DIST_DIR/src/main/java/org/kivy/android/"
          echo "Patched dist - WifiBridge count: $(grep -c 'WifiBridge' "$DIST_DIR/src/main/java/org/kivy/android/PythonActivity.java")"
        fi

        # ══════════════════════════════════════════════════
        # 3. 关键：删除整个dist + Gradle build缓存 + bootstrap_builds缓存
        #    强制buildozer从patched p4a模板完全重建
        # ══════════════════════════════════════════════════
        BUILD_BASE=$(dirname "$DIST_DIR")
        if [ -n "$BUILD_BASE" ] && [ -d "$BUILD_BASE" ]; then
          echo "Deleting dist + Gradle build cache..."
          rm -rf "$DIST_DIR"
          rm -rf "$BUILD_BASE/dists/cailing"
          rm -rf "$BUILD_BASE/build/bootstrap_builds"
          echo "Cache deleted"
        fi

        # ══════════════════════════════════════════════════
        # 4. 也在build.gradle中添加source/java源码路径（双保险）
        #    这样即使p4a覆盖了src/main/java中的文件，
        #    Gradle也会编译source/java/中的文件
        # ══════════════════════════════════════════════════
        # (这个在dist重建后做)

        rm -f bin/*.apk
        yes | buildozer -v android debug 2>&1 | tee -a build.log

    - name: Post-build: patch build.gradle and repackage
      run: |
        set -ex

        DIST_DIR=$(find . ~/.buildozer /home/runner -path "*/dists/cailing" -type d 2>/dev/null | head -1)
        echo "DIST_DIR=$DIST_DIR"

        if [ -z "$DIST_DIR" ]; then
          echo "No dist found, skipping post-build patch"
          exit 0
        fi

        # 检查dist中的PythonActivity.java是否包含WifiBridge
        PA_FILE="$DIST_DIR/src/main/java/org/kivy/android/PythonActivity.java"
        if [ -f "$PA_FILE" ]; then
          WB_COUNT=$(grep -c 'WifiBridge' "$PA_FILE" || echo 0)
          echo "WifiBridge count in dist PythonActivity.java: $WB_COUNT"

          # 如果没有WifiBridge，手动覆盖
          if [ "$WB_COUNT" -eq 0 ]; then
            echo "WifiBridge NOT in dist! Overwriting..."
            cp -f source/java/org/kivy/android/PythonActivity.java "$PA_FILE"
            cp -f source/java/org/kivy/android/WifiBridge.java "$(dirname $PA_FILE)/"
            echo "Overwritten - new count: $(grep -c 'WifiBridge' "$PA_FILE")"
          fi
        fi

        # 确保WifiBridge.java在dist中
        if [ ! -f "$DIST_DIR/src/main/java/org/kivy/android/WifiBridge.java" ]; then
          echo "WifiBridge.java missing from dist, copying..."
          cp -f source/java/org/kivy/android/WifiBridge.java "$DIST_DIR/src/main/java/org/kivy/android/"
        fi

        # 在build.gradle中添加source/java源码路径
        GRADLE_FILE="$DIST_DIR/build.gradle"
        if [ -f "$GRADLE_FILE" ] && ! grep -q "source/java" "$GRADLE_FILE"; then
          sed -i '/android {/a\    sourceSets {\n        main {\n            java.srcDirs += ["source/java"]\n        }\n    }' "$GRADLE_FILE"
          echo "Added source/java to build.gradle sourceSets"
        fi

        # 清除Gradle缓存并重新编译
        rm -rf "$DIST_DIR/build"
        cd "$DIST_DIR"
        ./gradlew assembleDebug 2>&1 | tee -a /home/runner/work/cailing/cailing/build.log
        cd /home/runner/work/cailing/cailing

        # 复制新APK到bin目录
        NEW_APK=$(find "$DIST_DIR/build/outputs/apk/" -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$NEW_APK" ]; then
          cp -f "$NEW_APK" bin/cailing-1.0.0-arm64-v8a_armeabi-v7a-debug.apk
          echo "New APK copied"
        fi

    - name: Verify APK contents
      if: always()
      run: |
        APK=$(find bin/ -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -n "$APK" ]; then
          echo "=== APK found: $APK ==="
          ls -la "$APK"
          echo "=== Checking classes.dex for WifiBridge ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "WifiBridge" && echo "✅ WifiBridge FOUND!" || echo "❌ WifiBridge NOT found"
          echo "=== Checking classes.dex for scanWifi ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "scanWifi" && echo "✅ scanWifi FOUND!" || echo "❌ scanWifi NOT found"
          echo "=== Checking classes.dex for addJavascriptInterface ==="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "addJavascriptInterface" && echo "✅ addJavascriptInterface FOUND!" || echo "❌ addJavascriptInterface NOT found"
          echo "=== Checking permissions ==="
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "ACCESS_\|WIFI\|LOCATION\|INTERNET"
        else
          echo "No APK found"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cailing-apk
        path: bin/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
